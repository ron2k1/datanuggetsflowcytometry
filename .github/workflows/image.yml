# Publishes the app image to GHCR for a release: ghcr.io/<owner>/datanuggets-flow as <version>
# and sha-<commit>, for linux/amd64 and linux/arm64, with provenance and an SBOM. latest moves too
# when the version is final and above the version latest names in the registry when promote
# runs, so a prerelease, an older version or a tag that never shipped never takes it. It runs for
# a tag v<version> that matches pyproject.toml, on a commit that is on main. release.yml calls it
# on that tag once the package is on PyPI, so no image carries a version PyPI lacks, and the
# image waits on the same tests and approval as the upload. Run it by hand on a tag whose run
# stopped before promote, such as after a runner outage. A version the registry already has is
# refused, since a published tag is fixed, unless it names this run's own digest: then a rerun of
# promote adds the tags a failed promote left out. app.yml checks the same Dockerfile on every
# pull request.
#
# The build is pushed by digest alone, with no tag. That digest is pulled back on an amd64 and
# an arm64 runner and app/scripts/smoke.py checks it in local and trial mode. Only when both pass
# does promote put the tags on it, so a version tag never names an image that failed them.
# GitHub creates the package as private on its first push. Make it public once in the package
# settings, or every pull needs a login.
name: image

# No push trigger of its own: a tag starts release.yml, which calls this after the upload.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # The ref must be a tag, the tag must be v + the version in pyproject.toml, and the commit must
  # already be on main. A run by hand also needs that version on PyPI.
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
      commit: ${{ steps.check.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: check
        name: A version tag, on main
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "::error::run this on a tag v<version>, not on $GITHUB_REF_NAME"
            exit 1
          fi
          commit=$(git rev-parse HEAD)
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error::$commit isn't on main"
            exit 1
          fi
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::the tag is $GITHUB_REF_NAME, and pyproject.toml says $version"
            exit 1
          fi
          # Run by hand, it builds only a version PyPI already has, as the release.yml path does.
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            name=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["name"])')
            code=$(curl -sS -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/$name/$version/json")
            if [ "$code" != 200 ]; then
              echo "::error::$name $version isn't on PyPI (HTTP $code). Release the package first."
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  publish:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The image carries the package's name, which is not the repository's. GHCR names must be
      # lowercase, and github.repository_owner keeps the owner's case
      - id: name
        name: Image name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/datanuggets-flow" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Its default licenses label comes from GitHub's license detection, which says GPL-2.0, so
      # the Dockerfile's GPL-2.0-only is set again here, on the labels and on the annotations.
      # The tags go on in promote. They are still listed here, because metadata-action takes the
      # version label from the highest-priority one.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ steps.name.outputs.image }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.gate.outputs.version }},priority=1000
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=datanuggets-flow
            org.opencontainers.image.licenses=GPL-2.0-only
          annotations: |
            org.opencontainers.image.title=datanuggets-flow
            org.opencontainers.image.licenses=GPL-2.0-only
      # pushed by digest, untagged, until the smoke jobs pass
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ steps.name.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            DN_VERSION=${{ needs.gate.outputs.version }}
            DN_REVISION=${{ needs.gate.outputs.commit }}
      - name: Summary
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "Pushed $IMAGE@$DIGEST, untagged until the smoke jobs pass" >> "$GITHUB_STEP_SUMMARY"

  # The pushed index, pulled by digest, so each runner gets its own architecture's image.
  smoke:
    name: smoke-${{ matrix.arch }}
    needs: [gate, publish]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      REF: ${{ needs.publish.outputs.image }}@${{ needs.publish.outputs.digest }}
      ARCH: ${{ matrix.arch }}
      VERSION: ${{ needs.gate.outputs.version }}
      COMMIT: ${{ needs.gate.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull by digest
        run: |
          docker pull "$REF"
          inspect() { docker image inspect "$REF" --format "$1"; }
          test "$(inspect '{{.Architecture}}')" = "$ARCH"
          test "$(inspect '{{index .Config.Labels "org.opencontainers.image.version"}}')" = "$VERSION"
          test "$(inspect '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$COMMIT"
          test "$(inspect '{{index .Config.Labels "org.opencontainers.image.licenses"}}')" = GPL-2.0-only
          echo "pulled $ARCH image of $VERSION"
      - name: Local mode
        run: |
          docker run -d --name dn-local -p 127.0.0.1:8000:8000 -v dn-smoke-data:/data "$REF"
          python3 app/scripts/smoke.py --base-url http://127.0.0.1:8000 --mode local
      - name: Trial mode
        run: |
          docker run -d --name dn-trial -p 127.0.0.1:8001:8000 \
            -e DN_MODE=trial -e DN_COOKIE_SECURE=0 "$REF"
          python3 app/scripts/smoke.py --base-url http://127.0.0.1:8001 --mode trial
      - name: Container logs
        if: always()
        run: |
          for c in dn-local dn-trial; do
            echo "::group::$c"
            docker logs "$c" 2>&1 | tail -n 200 || true
            echo "::endgroup::"
          done
      - name: Clean up
        if: always()
        run: |
          docker rm -f dn-local dn-trial || true
          docker volume rm dn-smoke-data || true

  # The tags, put on the digest both smoke jobs passed. imagetools create with one source index
  # and no annotations pushes that index unchanged, so each tag names the images that were tested.
  promote:
    needs: [gate, publish, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # One promote at a time across every tag, so two releases can't both read latest before
    # either moves it. Only this short job waits, not the builds. A third promote queued behind
    # two would cancel the waiting one, which Re-run failed jobs then tags as usual.
    concurrency:
      group: image-promote
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ${{ needs.publish.outputs.image }}
      DIGEST: ${{ needs.publish.outputs.digest }}
      TAGS: ${{ needs.publish.outputs.tags }}
      VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the tested digest
        run: |
          # lookup REF TEMPLATE sets found to what the registry says of REF, or to nothing when it
          # has no such tag. Any other failure stops the job, so an outage can't pass for a missing
          # tag.
          lookup() {
            if found=$(docker buildx imagetools inspect "$1" --format "$2" 2>&1); then
              exists=true
            elif grep -qiE "not found|manifest unknown" <<< "$found"; then
              found=
              exists=false
            else
              echo "::error::could not read $1 from the registry"
              echo "$found"
              exit 1
            fi
          }
          # A published version is fixed. Only a rerun of this same run may go on, since the tag
          # already names its digest, to add the tags a failed promote left out.
          lookup "$IMAGE:$VERSION" '{{ .Manifest.Digest }}'
          if [ "$exists" = true ] && [ "$found" != "$DIGEST" ]; then
            echo "::error::$IMAGE:$VERSION is already published. Ship the change as a new version."
            exit 1
          fi
          tags=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then tags+=("$tag"); fi
          done <<< "$TAGS"
          # latest goes to a final version, digits and dots only with no a, b, rc, dev or post
          # part, that sorts above the version latest names now. It is read here, not when the
          # run started, so a rerun of an older release or a slower parallel run sees the newer
          # one and leaves latest alone, and a v* tag that never shipped counts for nothing.
          final='^[0-9]+(\.[0-9]+)*$'
          if [[ "$VERSION" =~ $final ]]; then
            label='{{ index (index .Image "linux/amd64").Config.Labels "org.opencontainers.image.version" }}'
            lookup "$IMAGE:latest" "$label"
            if [ "$exists" = true ] && [ -z "$found" ]; then
              echo "::error::$IMAGE:latest has no version label, so it can't be compared"
              exit 1
            fi
            newest=$(printf '%s\n%s\n' "$found" "$VERSION" | sort -V | tail -n 1)
            if [ "$found" != "$VERSION" ] && [ "$newest" = "$VERSION" ]; then
              tags+=("$IMAGE:latest")
            fi
          fi
          args=()
          for tag in "${tags[@]}"; do args+=(--tag "$tag"); done
          docker buildx imagetools create "${args[@]}" "$IMAGE@$DIGEST"
          {
            echo "Tagged $IMAGE@$DIGEST"
            echo
            for tag in "${tags[@]}"; do echo "    $tag"; done
          } >> "$GITHUB_STEP_SUMMARY"
