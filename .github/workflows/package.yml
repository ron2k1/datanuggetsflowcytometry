# Builds the sdist and wheel and checks what a user would download, the way R CMD check reads the
# built tarball: scripts/check_dist.py and twine read the two files, then the wheel is installed
# alone in a new venv and the sdist's own tests run against it, with src/ deleted so nothing can
# import the source tree. release.yml calls this and uploads the files it checked.
name: package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# github.workflow is the caller's name when release.yml calls this, so a run of its own on the
# same ref can't cancel a release's
concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
      - name: Build
        run: uv build --out-dir dist
      - name: Allowlist, caches, paths and denied words
        run: uv run --no-project python scripts/check_dist.py dist
      - name: Metadata
        run: uvx --from twine==7.0.0 twine check --strict dist/*
      - name: Extract the sdist without its source tree
        run: |
          mkdir -p tmp/sdist
          tar -xzf dist/datanuggets_flow-*.tar.gz -C tmp/sdist --strip-components 1
          rm -rf tmp/sdist/src
      - name: The wheel alone, with only the dependencies it declares
        run: |
          uv venv --python 3.14 tmp/alone
          uv pip install --python tmp/alone dist/datanuggets_flow-*-py3-none-any.whl
          uv pip check --python tmp/alone
          cd tmp
          alone/bin/python -c "import datanuggets_flow as f; assert 'site-packages' in f.__file__, f.__file__"
          alone/bin/datanuggets-flow --help > /dev/null
      - name: The sdist's tests on the installed wheel
        run: |
          uv venv --python 3.14 tmp/wheel
          uv pip install --python tmp/wheel dist/datanuggets_flow-*-py3-none-any.whl pytest==9.1.1 pytest-xdist==3.8.0
          uv pip check --python tmp/wheel
          cd tmp/sdist
          ../wheel/bin/python -c "import datanuggets_flow as f; assert 'site-packages' in f.__file__, f.__file__"
          ../wheel/bin/python -m pytest -q -p no:cacheprovider -n 2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 7
          if-no-files-found: error
